name: Merge when clean

# Calls the shared merge-when-clean job in Tatendaz/coderabbit-failover. Its header and
# docs/merge-when-clean.md there list what it merges, what it skips, and how a fix is released.
# Extra paths the owner merges go in .github/merge-hold-paths (one regex per line).
# Pinned to the moving major tag, allowed by .github/zizmor.yml. Do not add a
# `merge-when-clean` concurrency group here: the shared job holds it.
on:
  schedule:
    - cron: '23,53 * * * *'
  status: {}
  pull_request_review:
    types: [submitted]
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read

jobs:
  merge:
    if: github.event_name != 'status' || github.event.state == 'success'
    uses: Tatendaz/coderabbit-failover/.github/workflows/reusable-merge-when-clean.yml@merge-when-clean-v1
