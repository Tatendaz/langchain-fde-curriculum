name: PR Gate

# Server-side mirror of the local pre-push gate from the tatendaz-github skill.
# Catches anyone (human or agent) who bypassed the local checks.
#
# POLICY ONLY. The test suite lives in ci.yml, which runs it across Python
# 3.11-3.14. Running pytest here as well would mean five test runs per PR and
# two competing "Tests" check names to wire into branch protection.
#
# Untrusted inputs (branch names, refs, labels) are passed to scripts via
# `env:` and expanded by the shell — never template-interpolated into `run:`
# bodies — to prevent workflow-injection from crafted fork branch names.

on:
  pull_request:
    branches: [main, master]
    # `labeled`/`unlabeled` are load-bearing, not decoration: applying the
    # `skip-coverage-gate` label must produce a NEW run. Re-running an existing
    # run replays the original event payload, which still would not contain the
    # label. Listing `types` overrides the defaults, so the default three are
    # repeated here explicitly.
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # `bash` (not the default `bash -e`) adds `-o pipefail`, so a failing stage
    # inside the grep pipelines below cannot be masked by a later success.
    shell: bash

jobs:
  docs-gate:
    # Dependabot bumps never carry docs entries; the docs gate is for human/agent PRs.
    # Bind to the PR author, not github.actor: the actor is whoever triggered
    # this run, so a human's "Update branch" click (a new synchronize run)
    # turns the skip off and the gate demands docs a bump PR never has (#9).
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    name: Docs gate (features + summaries)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Both files are checked in ONE step so a contributor who is missing both
      # learns that in one run instead of two round trips.
      - name: Require docs/features and docs/summaries entries
        run: |
          # GITHUB_HEAD_REF is set by the runner, not interpolated — the branch
          # name never reaches the shell as workflow template text.
          branch="${GITHUB_HEAD_REF:-}"

          # FAIL CLOSED. GITHUB_HEAD_REF is only populated for pull_request
          # events. With an empty slug the glob below would degenerate to
          # "docs/features/<any date>-.md" at best and, in the previous
          # unanchored form, to "any docs file at all" — which always matched.
          if [ -z "$branch" ]; then
            echo "::error::GITHUB_HEAD_REF is empty, so no docs slug can be derived."
            echo "This gate only supports the pull_request event."
            exit 1
          fi

          # Strip a conventional type prefix, then flatten remaining slashes.
          # `feature/` has to be listed separately: it is NOT matched by the old
          # `${branch#feat/}`, so `feature/new-thing` used to demand a file
          # literally named `<date>-feature-new-thing.md`.
          slug=$(printf '%s' "$branch" | sed -E \
            's#^(feat|feature|fix|hotfix|bugfix|chore|docs|refactor|perf|test|build|ci|style|release)/##')
          slug="${slug//\//-}"

          if [ -z "$slug" ]; then
            echo "::error::Branch '$branch' reduces to an empty slug."
            exit 1
          fi

          echo "Branch: $branch"
          echo "Slug:   $slug"

          shopt -s nullglob
          missing=0
          for dir in features summaries; do
            # ANCHORED on the YYYY-MM-DD prefix. The previous pattern was
            # `docs/$dir/*"$slug".md` — an unanchored *suffix* match, so any
            # branch whose slug happened to be the tail of an existing filename
            # passed with no new doc at all (`chore/2026-refresh` matched
            # `2026-07-05-mastery-gates-2026-refresh.md`).
            #
            # "$slug" is quoted inside the glob, so its contents are literal and
            # a branch name can never smuggle in a wildcard.
            matches=(docs/"$dir"/[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]-"$slug".md)
            if [ ${#matches[@]} -eq 0 ]; then
              echo "::error::Missing docs/$dir/<YYYY-MM-DD>-$slug.md for branch '$branch'."
              missing=1
            else
              echo "OK: ${matches[*]}"
            fi
          done

          if [ "$missing" -ne 0 ]; then
            echo "Both files are required. See CONTRIBUTING.md -> 'Required docs entries'"
            echo "for the naming rule and a worked example."
            exit 1
          fi

  coverage-for-new-code:
    name: New code has new tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check that changed source files have changed tests
        env:
          # `contains()` over a label array evaluates to the literal string
          # "true" or "false", so no attacker-controlled text reaches the shell.
          # Only users with write access can label a PR, so this cannot be
          # self-applied by an outside contributor.
          SKIP_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'skip-coverage-gate') }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # --- Escape hatch -------------------------------------------------
          # This repo's product IS its worked examples: phases 0-3 exist to be
          # read and corrected, and CONTRIBUTING.md explicitly invites "outdated
          # API names" fixes. Such a change edits a .py file, has no behaviour
          # to assert, and would otherwise be permanently unmergeable. A
          # maintainer applies `skip-coverage-gate` and the gate stands down.
          if [ "$SKIP_LABEL" = "true" ]; then
            echo "::notice::'skip-coverage-gate' label applied by a maintainer — gate skipped."
            echo "Use this only for changes with no assertable behaviour"
            echo "(comment/docstring wording, a renamed upstream API symbol)."
            exit 0
          fi

          # `actions/checkout` already fetched full history (fetch-depth: 0) and
          # base.sha is the base commit GitHub computed for this PR, so no extra
          # `git fetch` — and therefore no credentials — is needed.
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "::error::Base commit $BASE_SHA is not present in this checkout."
            exit 1
          fi
          changed=$(git diff --name-only "${BASE_SHA}...HEAD")

          # Source = a code file that is not under a test/docs/.github dir and
          # is not itself a test file. The `^test_` alternative used to sit
          # inside a group terminated by `$`, so it only matched a line that was
          # exactly "test_" — a root-level test_foo.py counted as source. It now
          # has its own anchored pattern.
          src_changed=$(printf '%s\n' "$changed" \
            | grep -Ev '(^|/)(test|tests|__tests__|spec|docs|\.github)/' \
            | grep -Ev '(^|/)test_[^/]+\.py$' \
            | grep -Ev '(_test\.go|\.test\.(ts|tsx|js|jsx)|\.spec\.(ts|tsx|js|jsx)|_spec\.rb)$' \
            | grep -E '\.(py|ts|tsx|js|jsx|go|rs|rb|java|kt)$' || true)
          test_changed=$(printf '%s\n' "$changed" \
            | grep -E '(^|/)(test|tests|__tests__|spec)/|_test\.go$|\.test\.(ts|tsx|js|jsx)$|\.spec\.(ts|tsx|js|jsx)$|(^|/)test_[^/]+\.py$|_spec\.rb$' || true)

          if [ -n "$src_changed" ] && [ -z "$test_changed" ]; then
            echo "::error::Source files changed but no test files changed:"
            printf '%s\n' "$src_changed"
            echo ""
            echo "Add a test that covers the change."
            echo "If this is a documentation-grade fix to a worked example — comment or"
            echo "docstring wording, a renamed upstream API symbol — there is nothing to"
            echo "assert. Say so in the PR description and ask a maintainer to apply the"
            echo "'skip-coverage-gate' label. See CONTRIBUTING.md -> 'Does my change need a test?'."
            exit 1
          fi

          # `echo "$var" | wc -l` prints 1 for an empty variable, so a docs-only
          # PR used to report "Source changes: 1 file(s)".
          count() {
            if [ -z "$1" ]; then echo 0; else printf '%s\n' "$1" | wc -l | tr -d ' '; fi
          }
          echo "Source changes: $(count "$src_changed") file(s)"
          echo "Test changes:   $(count "$test_changed") file(s)"
