[project]
name = "langchain-fde-curriculum"
version = "0.1.0"
description = "Hands-on work for the LangChain / LangGraph / LangSmith FDE curriculum."
readme = "README.md"
requires-python = ">=3.11"
# Upper bounds on the two core frameworks: teaching material breaks loudly on
# major-version bumps (e.g. langgraph v2 removes deprecated prebuilts), so a
# fresh `uv sync` should never silently jump a major.
dependencies = [
    "langchain>=1.0,<2",
    "langgraph>=1.0,<2",
    "langchain-mcp-adapters>=0.1",
    "langchain-text-splitters>=0.3",
    "mcp>=1.0",
    "langchain-ollama>=0.2",
    "langsmith>=0.1",
    "httpx>=0.27",
    "pydantic>=2",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

# This is an application, not a publishable library, so uv shouldn't try to
# build/install the project itself — it just manages the venv + dependencies.
[tool.uv]
package = false

[tool.pytest.ini_options]
# Put the repo root on sys.path so tests can `import phase0` etc.
pythonpath = ["."]
# The whole suite is offline by rule. If a phase 4 eval ever genuinely needs a
# live model or an API key, mark it `@pytest.mark.live`: PR CI never runs those
# (secrets aren't available to fork PRs anyway), only the manually-dispatched
# `live-smoke` job does.
markers = [
    "live: needs a live model or API key; excluded from PR CI",
]
